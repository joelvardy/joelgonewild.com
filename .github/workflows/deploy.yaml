on:
  push:
    branches:
      - main
permissions:
  id-token: write
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Falls back to the most recent cache, the build's image manifest then only regenerates new or changed photos
      - name: Restore resized images
        uses: actions/cache@v6
        with:
          path: |
            public/*/*.jpg
            public/*/*.avif
            .image-manifest.json
          key: images-${{ hashFiles('posts/**/photos/*.jpg', 'process.ts') }}
          restore-keys: images-
      - name: Build
        run: npm run build
      # After the build, so a long image build can't use up the session before the upload finishes
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::527669730630:role/joelgonewild-github-deploy
          role-duration-seconds: 7200
          aws-region: eu-west-2
      - name: Deploy infrastructure
        run: npm run deploy
      - name: Upload site
        run: |
          stack_output() {
            aws cloudformation describe-stacks --stack-name joelgonewild-v1-main --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text
          }
          BUCKET="$(stack_output WebsiteS3BucketName)"
          DISTRIBUTION="$(stack_output CloudfrontDistributionId)"
          aws s3 sync ./public/. s3://$BUCKET --delete --exclude "*.jpg" --exclude "*.avif" --cache-control "public, max-age=300"
          aws s3 sync ./public/. s3://$BUCKET --delete --exclude "*" --include "*.jpg" --cache-control "public, max-age=604800"
          aws s3 sync ./public/. s3://$BUCKET --delete --exclude "*" --include "*.avif" --content-type image/avif --cache-control "public, max-age=604800"
          aws cloudfront create-invalidation --distribution-id $DISTRIBUTION --paths "/*"
