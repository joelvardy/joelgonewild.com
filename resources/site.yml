AWSTemplateFormatVersion: '2010-09-09'
Description: joelgonewild.com - private S3 bucket behind CloudFront, plus a redirect from the apex domain to www

Parameters:
  CertificateArn:
    Type: String
    Default: arn:aws:acm:us-east-1:527669730630:certificate/eacced7b-320f-4762-a96e-811b137881eb
  HostedZoneName:
    Type: String
    Default: joelgonewild.com.

Mappings:
  CloudFront:
    Managed:
      CachingOptimized: 658327ea-f89d-4fab-a63d-7e88639e58f6
      CachingDisabled: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
      AllViewerExceptHostHeader: b689b0a8-53d0-40ab-baf2-68738e2966ac
      SecurityHeaders: 67f7725c-6f97-4210-82d7-5512b31e9d03
      # Same for every CloudFront distribution, used by Route 53 alias records
      HostedZoneId: Z2FDTNDATAQYW2

Resources:
  WebsiteS3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${AWS::StackName}-website
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  WebsiteS3BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebsiteS3Bucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${WebsiteS3Bucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudfrontDistribution}

  WebsiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-website
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # The S3 website endpoint used to serve index.html for directories, the REST endpoint behind OAC doesn't
  IndexRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub ${AWS::StackName}-index-rewrite
      AutoPublish: true
      FunctionConfig:
        Comment: Serve index.html for directory paths, and add a trailing slash to them
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
            var request = event.request;
            if (request.uri.endsWith('/')) {
                request.uri += 'index.html';
            } else if (request.uri.split('/').pop().indexOf('.') === -1) {
                return {
                    statusCode: 301,
                    statusDescription: 'Moved Permanently',
                    headers: { location: { value: request.uri + '/' } },
                };
            }
            return request;
        }

  CloudfrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Ref AWS::StackName
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Aliases:
          - www.joelgonewild.com
        Origins:
          - Id: S3WebsiteOrigin
            DomainName: !GetAtt WebsiteS3Bucket.RegionalDomainName
            OriginAccessControlId: !Ref WebsiteOriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: S3WebsiteOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
          Compress: true
          CachePolicyId: !FindInMap [CloudFront, Managed, CachingOptimized]
          ResponseHeadersPolicyId: !FindInMap [CloudFront, Managed, SecurityHeaders]
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt IndexRewriteFunction.FunctionMetadata.FunctionARN
        # Without s3:ListBucket a missing key is a 403, not a 404
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /error.html
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /error.html
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021

  RedirectS3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${AWS::StackName}-redirect
      WebsiteConfiguration:
        RedirectAllRequestsTo:
          HostName: www.joelgonewild.com
          Protocol: https

  RedirectCloudfrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: joelgonewild.com to www.joelgonewild.com
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Aliases:
          - joelgonewild.com
        Origins:
          - Id: RedirectS3Bucket
            DomainName: !Sub ${RedirectS3Bucket}.s3-website.${AWS::Region}.amazonaws.com
            CustomOriginConfig:
              HTTPPort: 80
              OriginProtocolPolicy: http-only
        DefaultCacheBehavior:
          TargetOriginId: RedirectS3Bucket
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
          Compress: true
          # Forwards query strings so they survive the redirect
          CachePolicyId: !FindInMap [CloudFront, Managed, CachingDisabled]
          OriginRequestPolicyId: !FindInMap [CloudFront, Managed, AllViewerExceptHostHeader]
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021

  WebsiteRoute53Cname:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneName: !Ref HostedZoneName
      Name: joelgonewild.com
      Type: A
      AliasTarget:
        DNSName: !GetAtt RedirectCloudfrontDistribution.DomainName
        HostedZoneId: !FindInMap [CloudFront, Managed, HostedZoneId]

  WebsiteRoute53Ipv6:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneName: !Ref HostedZoneName
      Name: joelgonewild.com
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt RedirectCloudfrontDistribution.DomainName
        HostedZoneId: !FindInMap [CloudFront, Managed, HostedZoneId]

  WebsiteWwwRoute53Cname:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneName: !Ref HostedZoneName
      Name: www.joelgonewild.com
      Type: A
      AliasTarget:
        DNSName: !GetAtt CloudfrontDistribution.DomainName
        HostedZoneId: !FindInMap [CloudFront, Managed, HostedZoneId]

  WebsiteWwwRoute53Ipv6:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneName: !Ref HostedZoneName
      Name: www.joelgonewild.com
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt CloudfrontDistribution.DomainName
        HostedZoneId: !FindInMap [CloudFront, Managed, HostedZoneId]

Outputs:
  WebsiteS3BucketName:
    Value: !Ref WebsiteS3Bucket
  CloudfrontDistributionId:
    Value: !Ref CloudfrontDistribution
